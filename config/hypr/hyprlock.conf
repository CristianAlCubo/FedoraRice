# hyprlock — composición en dos zonas: panel izquierdo (fondo difuminado) con la información,
# y el arte nítido a la derecha. Los fondos los genera scripts/lockbg.sh.
# El panel ocupa el 30 % izquierdo del monitor principal; su centro está a 0,35·ancho del centro.
# scripts/lock.sh detecta los monitores conectados cada vez que bloquea y escribe
# ~/.cache/hyprlock/monitors.conf con: $main (monitor del panel), $px/$pxl/$pxr (columna del panel)
# y un fondo por monitor (si no hay imagen, usa una captura difuminada: nunca queda en negro).
# Colores y fuentes: generados desde ~/.config/rice/theme.json (comando: rice-theme)
source = @HOME@/.config/hypr/colors.conf
source = @HOME@/.cache/hyprlock/monitors.conf

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = out, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 6, out
    animation = fadeOut, 1, 4, out
    animation = inputFieldDots, 1, 2, out
    animation = inputFieldColors, 1, 3, out
    animation = inputFieldFade, 1, 4, out
}

# ── Fondos: definidos en ~/.cache/hyprlock/monitors.conf (los genera lock.sh) ──

# ── Cabecera del panel ──────────────────────────────────────
label {
    monitor = $main
    text = // pantalla bloqueada
    color = $accent
    font_size = 15
    font_family = $mono
    position = $px, 430
    halign = center
    valign = center
}

# Saludo según la hora
label {
    monitor = $main
    text = cmd[update:300000] h=$(date +%-H); if [ $h -lt 12 ]; then g="Buenos días"; elif [ $h -lt 20 ]; then g="Buenas tardes"; else g="Buenas noches"; fi; echo "$g,"
    color = $dim
    font_size = 30
    font_family = $mono
    position = $px, 300
    halign = center
    valign = center
}
# Hora y fecha
label {
    monitor = $main
    text = cmd[update:1000] date +%H:%M
    color = $text
    font_size = 132
    font_family = $mono
    position = $px, 170
    halign = center
    valign = center
}
label {
    monitor = $main
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +'%A, %-d de %B' | sed 's/^./\U&/'
    color = $dim
    font_size = 24
    font_family = $mono
    position = $px, 60
    halign = center
    valign = center
}

# ── Usuario: foto, nombre y debajo la contraseña ────────────
image {
    monitor = $main
    path = @HOME@/.config/hypr/avatar.png
    size = 136
    rounding = -1
    border_size = 3
    border_color = rgba(51, 204, 255, 0.9)
    position = $px, -85
    halign = center
    valign = center
}
label {
    monitor = $main
    text = cmd[update:3600000] getent passwd $USER | cut -d: -f5 | cut -d, -f1 | cut -d' ' -f1
    color = $text
    font_size = 28
    font_family = $mono Bold
    position = $px, -185
    halign = center
    valign = center
}

# ── Contraseña ──────────────────────────────────────────────
input-field {
    monitor = $main
    size = 380, 62
    position = $px, -265
    halign = center
    valign = center
    rounding = -1
    outline_thickness = 1
    outer_color = $line
    inner_color = $faint
    font_color = $text
    font_family = $mono
    check_color = rgba(51, 204, 255, 1.0)
    fail_color = rgba(255, 107, 122, 1.0)
    capslock_color = rgba(255, 196, 77, 1.0)
    numlock_color = -1
    bothlock_color = -1
    swap_font_color = false
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span foreground="##969cac">Contraseña</span>
    fail_text = <span foreground="##ff6b7a">$FAIL</span>
    hide_input = false
    shadow_passes = 0
}

# ── Botones de energía (clic) ───────────────────────────────
shape {
    monitor = $main
    size = 58, 58
    color = $faint
    rounding = -1
    border_size = 1
    border_color = $line
    position = $pxl, -385
    halign = center
    valign = center
}
shape {
    monitor = $main
    size = 58, 58
    color = $faint
    rounding = -1
    border_size = 1
    border_color = $line
    position = $px, -385
    halign = center
    valign = center
}
shape {
    monitor = $main
    size = 58, 58
    color = rgba(255, 107, 122, 0.10)
    rounding = -1
    border_size = 1
    border_color = rgba(255, 107, 122, 0.45)
    position = $pxr, -385
    halign = center
    valign = center
}
label {
    monitor = $main
    text = 󰤄
    color = $text
    font_size = 24
    font_family = FiraCode Nerd Font Mono
    position = $pxl, -385
    halign = center
    valign = center
    onclick = systemctl suspend
}
label {
    monitor = $main
    text = 󰜉
    color = $text
    font_size = 22
    font_family = FiraCode Nerd Font Mono
    position = $px, -385
    halign = center
    valign = center
    onclick = systemctl reboot
}
label {
    monitor = $main
    text = 󰐥
    color = rgba(255, 107, 122, 1.0)
    font_size = 22
    font_family = FiraCode Nerd Font Mono
    position = $pxr, -385
    halign = center
    valign = center
    onclick = systemctl poweroff
}
