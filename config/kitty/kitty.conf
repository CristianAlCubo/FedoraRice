map ctrl+shift+enter launch --location=vsplit
enabled_layouts splits

# Ventana
window_padding_width 10
confirm_os_window_close 0
cursor_shape beam
cursor_blink_interval 0
disable_ligatures never

# ── Calidad de vida ──
scrollback_lines 20000
copy_on_select clipboard
strip_trailing_spaces smart
enable_audio_bell no
visual_bell_duration 0
detect_urls yes
url_style curly
show_hyperlink_targets yes
mouse_hide_wait 3
shell_integration enabled
tab_bar_min_tabs 2
tab_powerline_style round

# Pestañas y ventanas: se abren en la carpeta actual
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+minus launch --location=hsplit --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
# Moverse entre divisiones con Ctrl+Shift+flechas
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
# Saltar entre prompts (requiere la integración de shell) y ver la salida del último comando
map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1
map ctrl+shift+g show_last_command_output

# Colores y fuente: generados desde ~/.config/rice/theme.json (comando: rice-theme)
include theme.conf
